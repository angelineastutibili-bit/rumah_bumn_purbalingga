{% extends 'inventory/base.html' %}

{% block title %}Tambah Barang Masuk{% endblock %}

{% block content %}
<div class="header">
    <div>
        <h1><i class="fa-solid fa-box-open" style="color:#176b3a;margin-right:10px;"></i>Tambah Barang Masuk</h1>
        <p>Catat penerimaan barang dan tambah stok ke kantor.</p>
    </div>
</div>

<div class="form-card">
    <form method="POST">
        {% csrf_token %}

        <div class="form-grid">

            <div class="form-group full-width">
                <label for="produk">Produk <span style="color:#d32f2f;">*</span></label>
                <select name="produk" id="produk" required>
                    <option value="">-- Pilih Produk --</option>
                    {% for item in produk %}
                    <option value="{{ item.id }}">{{ item.kode_produk }} – {{ item.nama_produk }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="jumlah">Jumlah Barang Masuk <span style="color:#d32f2f;">*</span></label>
                <input type="number" name="jumlah" id="jumlah" min="1" placeholder="Masukkan jumlah" required>
            </div>

            <div class="form-group">
                <label for="asal">Asal Barang</label>
                <input type="text" name="asal" id="asal" placeholder="cth: Supplier, UMKM, Gudang Pusat">
            </div>

            <div class="form-group full-width">
                <label for="keterangan">Keterangan</label>
                <textarea name="keterangan" id="keterangan" rows="3" placeholder="Catatan tambahan (opsional)"></textarea>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-floppy-disk"></i> Simpan
            </button>
            <a href="{% url 'data_barang_masuk' %}" class="btn btn-secondary">
                <i class="fa-solid fa-xmark"></i> Batal
            </a>
        </div>
    </form>
</div>
{% endblock %}
